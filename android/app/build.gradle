plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def sampleAssets = layout.buildDirectory.dir('generated/readerAssets')
def copySample = tasks.register('copySample', Copy) {
    from rootProject.file('../public/sample.pdf')
    into sampleAssets
}
def readingAssets = layout.buildDirectory.dir('generated/configAssets')
def readingConfig = tasks.register('readingConfig', Exec) {
    workingDir rootProject.file('..')
    inputs.files('../../scripts/android-reading-config.mts', '../../src/core/templates.ts', '../../server/provider-catalog.ts', '../../package-lock.json')
    inputs.file('../../scripts/android-reading-core.mts')
    inputs.dir('../../src/core')
    inputs.file('../../src/types.ts')
    outputs.dir(readingAssets)
    commandLine 'node', '--import', 'tsx', 'scripts/android-reading-config.mts', readingAssets.get().asFile.absolutePath
}
def iconsDir = layout.buildDirectory.dir('generated/readerDrawables')
def readerIcons = tasks.register('readerIcons', Exec) {
    workingDir rootProject.file('..')
    inputs.files('../../scripts/android-reader-icons.mts', '../../package-lock.json')
    outputs.dir(iconsDir)
    commandLine 'node', '--import', 'tsx', 'scripts/android-reader-icons.mts', iconsDir.get().asFile.absolutePath
}

android {
    namespace = 'app.inkask.tablet'
    compileSdk = 36

    defaultConfig {
        applicationId = 'app.inkask.tablet'
        minSdk = 31
        targetSdk = 36
        versionCode = 15
        versionName = '0.4.8'
    }

    sourceSets {
        main.assets.srcDir(sampleAssets.get().asFile)
        main.assets.srcDir(readingAssets.get().asFile)
        main.res.srcDir(iconsDir.get().asFile)
    }
    buildFeatures {
        compose = true
    }
}

tasks.named('preBuild').configure {
    dependsOn(copySample)
    dependsOn(readingConfig)
    dependsOn(readerIcons)
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.08.00')
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'wang.harlon.quickjs:wrapper-android:3.2.3'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:ext-tables:4.6.2'
    implementation 'io.noties.markwon:inline-parser:4.6.2'
    implementation 'io.noties.markwon:ext-latex:4.6.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
